VAPID_PUBLIC_KEY = "BNCrerliOTMAYNlOcj3o1Wd4HV5EAJIHyhtlRcPMqgyGGS2sReqWCGrPw_T93c9CFOHhVeiOSJ-VnN6umHDt5Ns"
